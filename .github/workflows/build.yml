name: Build and Push Tracker API

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'app/**'
      - 'core/**'
      - 'handlers/**'
      - 'models/**'
      - 'pkg/**'
      - 'repositories/**'
      - 'router/**'
      - 'services/**'
      - 'utils/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# One build at a time on the home-server runner; a newer push to main replaces a queued or running one.
concurrency:
  group: build-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 9itchi-tracker-api

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: [self-hosted, 9itchi]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: memory=1536m

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        id: owner
        run: |
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger deployment
    needs: build
    runs-on: [self-hosted, 9itchi]
    steps:
      - name: Dispatch service-built event
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '${{ github.repository_owner }}',
              repo: '9itchi-deployment',
              event_type: 'service-built',
              client_payload: {
                service: 'tracker-api',
                version: '${{ github.sha }}',
                image_url: 'ghcr.io/' + context.repo.owner.toLowerCase() + '/${{ env.IMAGE_NAME }}:${{ github.sha }}'
              }
            })
